<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anti-Theft Security Tracker</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Ikonkalar Kutubxonasi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html { width: 100%; height: 100%; background: #030712; color: #fff; overflow: hidden; }
        
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .active-screen { display: flex; flex-direction: column; }

        /* Auth Screen */
        #authScreen { background: #090d16; z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #0d1b2a; border: 1px solid rgba(0, 162, 255, 0.2); padding: 30px; border-radius: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .auth-card h2 { margin-bottom: 24px; font-size: 20px; color: #00e676; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #8ab4f8; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 14px; background: #050a14; border: 1px solid rgba(0, 162, 255, 0.3); border-radius: 14px; color: #fff; font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00c853, #00e676); border: none; border-radius: 14px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        .auth-btn:active { transform: scale(0.97); }

        /* Menyu */
        #menuScreen { background: #050b14; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .menu-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
        .menu-title { color: #8ab4f8; font-size: 18px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .menu-btn { padding: 15px 20px; background: #101e36; border: 1px solid rgba(0, 162, 255, 0.2); border-radius: 16px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left; }
        .menu-btn.primary { background: linear-gradient(135deg, #00c853, #00e676); color: #000; border: none; }
        .menu-btn.danger { background: linear-gradient(135deg, #b71c1c, #d32f2f); color: #fff; border: none; }

        /* Xarita */
        #mapScreen { position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .panel { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000; background: rgba(10, 18, 32, 0.9); backdrop-filter: blur(14px); padding: 16px; border-radius: 16px; border: 1px solid rgba(0, 162, 255, 0.25); }
        .info { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: #14233c; color: #fff; border: 1px solid rgba(0, 162, 255, 0.25); padding: 8px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .admin-box { margin-top: 12px; border-top: 1px solid rgba(0, 162, 255, 0.2); padding-top: 10px; }
        .user-select { width: 100%; padding: 10px; background: #050a14; color: #fff; border: 1px solid rgba(0, 162, 255, 0.25); border-radius: 10px; font-size: 13px; margin-top: 6px; outline: none; }
        .gps-center-btn { position: absolute; bottom: 30px; right: 20px; z-index: 1000; width: 56px; height: 56px; background: #0a1220; border: 2px solid #00e676; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #00e676; font-size: 22px; }

        .pulse-marker-container { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
        .pulse-dot { width: 22px; height: 22px; background: #00e676; border: 3px solid #fff; border-radius: 50%; z-index: 2; }
        .pulse-ring { position: absolute; width: 44px; height: 44px; background: rgba(0, 230, 118, 0.5); border-radius: 50%; animation: fast-pulse 0.5s infinite linear; z-index: 1; }
        @keyframes fast-pulse { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
    </style>
</head>
<body>

    <!-- Kirish Oynasi -->
    <div id="authScreen" class="screen active-screen">
        <div class="auth-card">
            <h2><i class="fa-solid fa-shield-halved"></i> Tizimga Kirish</h2>
            <div class="input-group">
                <label>Taxallusingizni (Nik) kiriting:</label>
                <input type="text" id="usernameInput" placeholder="Masalan: Abdulla yoki ADMIN">
            </div>
            <button class="auth-btn" type="button" onclick="handleAuth()">Kirish</button>
        </div>
    </div>

    <!-- Menyu (Faqat ADMIN uchun) -->
    <div id="menuScreen" class="screen">
        <div class="menu-card">
            <div class="menu-title"><i class="fa-solid fa-user-shield"></i> <span id="menuUserName">--</span> (Admin)</div>
            <button class="menu-btn primary" type="button" onclick="openMapScreen()"><i class="fa-solid fa-globe"></i> Kuzatuv Xaritasi</button>
            <button class="menu-btn danger" type="button" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Chiqish</button>
        </div>
    </div>

    <!-- Xarita Oynasi -->
    <div id="mapScreen" class="screen">
        <div class="panel">
            <div class="info">
                <span><i class="fa-solid fa-user-tag"></i> <strong id="mapUserName" style="color:#00e676;">--</strong></span>
                <button class="back-btn" id="panelBackBtn" type="button" onclick="handleBackAction()">Orqaga</button>
            </div>
            <div id="adminPanel" class="admin-box" style="display: none;">
                <div class="info" style="color: #ff9800; font-weight: bold;"><i class="fa-solid fa-users"></i> Foydalanuvchilar Ro'yxati</div>
                <select id="userListSelect" class="user-select" onchange="focusUserOnMap()">
                    <option value="">Foydalanuvchini tanlang...</option>
                </select>
            </div>
        </div>
        <div class="gps-center-btn" onclick="centerToMyLocation()"><i class="fa-solid fa-crosshairs"></i></div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = null;
        var markers = {};
        var currentUser = null;
        var isAdmin = false;
        var lastLat = 41.2995;
        var lastLng = 69.2401;

        function handleAuth() {
            var inputVal = document.getElementById('usernameInput').value;
            if (!inputVal) {
                alert("Iltimos, ismingizni kiriting!");
                return;
            }

            currentUser = inputVal.trim();

            if (currentUser === "ADMIN") {
                isAdmin = true;
                showScreen('menuScreen');
                document.getElementById('menuUserName').innerText = currentUser;
            } else {
                isAdmin = false;
                saveUserPosition(currentUser, lastLat, lastLng);
                openMapScreen();
            }
        }

        function showScreen(screenId) {
            document.getElementById('authScreen').classList.remove('active-screen');
            document.getElementById('menuScreen').classList.remove('active-screen');
            document.getElementById('mapScreen').classList.remove('active-screen');
            document.getElementById(screenId).classList.add('active-screen');
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            showScreen('authScreen');
        }

        function handleBackAction() {
            if (isAdmin) {
                showScreen('menuScreen');
            } else {
                logout();
            }
        }

        function openMapScreen() {
            showScreen('mapScreen');
            document.getElementById('mapUserName').innerText = currentUser;

            var adminPanel = document.getElementById('adminPanel');
            var backBtn = document.getElementById('panelBackBtn');

            if (isAdmin) {
                adminPanel.style.display = 'block';
                backBtn.innerText = 'Menyu';
            } else {
                adminPanel.style.display = 'none';
                backBtn.innerText = 'Chiqish';
            }

            if (!map) {
                initMap();
            } else {
                setTimeout(function() { map.invalidateSize(); }, 200);
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, maxZoom: 18 }).setView([lastLat, lastLng], 14);
            
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { 
                maxZoom: 18 
            }).addTo(map);

            map.on('click', function(e) {
                if (!isAdmin) {
                    lastLat = e.latlng.lat;
                    lastLng = e.latlng.lng;
                    saveUserPosition(currentUser, lastLat, lastLng);
                    alert("Joylashuvingiz xaritada belgilandi!");
                }
            });

            if (!isAdmin) {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(function(pos) {
                        lastLat = pos.coords.latitude;
                        lastLng = pos.coords.longitude;
                        map.setView([lastLat, lastLng], 16);
                        saveUserPosition(currentUser, lastLat, lastLng);
                    }, function() {
                        saveUserPosition(currentUser, lastLat, lastLng);
                    });
                } else {
                    saveUserPosition(currentUser, lastLat, lastLng);
                }
            } else {
                startAdminSync();
            }

            setTimeout(function() { map.invalidateSize(); }, 200);
        }

        function centerToMyLocation() {
            if (!isAdmin) {
                map.setView([lastLat, lastLng], 16);
            } else {
                var selectedUser = document.getElementById('userListSelect').value;
                if (selectedUser && markers[selectedUser]) {
                    map.setView(markers[selectedUser].getLatLng(), 16);
                }
            }
        }

        function saveUserPosition(username, lat, lng) {
            var userObj = { lat: lat, lng: lng, time: new Date().toLocaleTimeString() };
            
            try {
                var stored = JSON.parse(localStorage.getItem('app_users_data') || '{}');
                stored[username] = userObj;
                localStorage.setItem('app_users_data', JSON.stringify(stored));
            } catch(e) {}

            displayMarker(username, lat, lng);
        }

        function displayMarker(username, lat, lng) {
            if (!markers[username]) {
                var pulseIcon = L.divIcon({
                    className: 'pulse-marker',
                    html: '<div class="pulse-marker-container"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>',
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });
                markers[username] = L.marker([lat, lng], { icon: pulseIcon }).addTo(map).bindPopup('<b>' + username + '</b>');
            } else {
                markers[username].setLatLng([lat, lng]);
            }
        }

        function startAdminSync() {
            setInterval(function() {
                try {
                    var stored = JSON.parse(localStorage.getItem('app_users_data') || '{}');
                    var select = document.getElementById('userListSelect');
                    var currentVal = select.value;
                    
                    select.innerHTML = '<option value="">Foydalanuvchini tanlang...</option>';
                    
                    for (var uName in stored) {
                        var uData = stored[uName];
                        displayMarker(uName, uData.lat, uData.lng);

                        var opt = document.createElement('option');
                        opt.value = uName;
                        opt.innerText = uName + ' (' + uData.time + ')';
                        select.appendChild(opt);
                    }
                    select.value = currentVal;
                } catch(e) {}
            }, 1000);
        }

        function focusUserOnMap() {
            var selectedUser = document.getElementById('userListSelect').value;
            if (selectedUser && markers[selectedUser]) {
                map.setView(markers[selectedUser].getLatLng(), 17);
                markers[selectedUser].openPopup();
            }
        }
    </script>
</body>
</html>
